server {
    listen 80;
    server_name _;

    # invoice emails upload base64 PDFs (~8 MB) — leave generous headroom
    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # local AI chat replies can take ~30s+
        proxy_buffering off;       # streamed chat answers
    }

    # static site + SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(webm|mp4|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
